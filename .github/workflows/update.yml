# Weekly flake.lock update as a PR, only opened if every host still evaluates.
# PRs made with the default token don't trigger eval.yml, so it runs here.
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".
name: update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"
      - run: .github/eval.sh
      - name: Open or refresh the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update-flake-lock
          { echo "flake.lock: update"; echo; grep -E '^(•|  )' "$RUNNER_TEMP/update.log" || true; } > "$RUNNER_TEMP/msg"
          git commit -q -a -F "$RUNNER_TEMP/msg"
          git push -f origin update-flake-lock
          gh pr view update-flake-lock >/dev/null 2>&1 || gh pr create --fill --base main --head update-flake-lock
